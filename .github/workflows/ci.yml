name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Migrate test database
        run: npm run db:migrate

      - name: Test logging platform
        run: npm run test:logs && npm run test:logs:db
        env:
          RUN_DATABASE_TESTS: "1"

      - name: Test mobile alerting and external monitoring
        run: npm run test:alerting

      - name: Test durable log agent with isolated model and Loki fixtures
        run: npm run test:agent

      - name: Test menu permissions
        run: npm run test:menu-permissions && npm run test:menu-permissions:db
        env:
          RUN_DATABASE_TESTS: "1"

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://warehouse:warehouse@127.0.0.1:5433/warehouse?schema=public
      POSTGRES_PASSWORD: warehouse
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated test database
        run: docker compose -f docker-compose.yml up -d --wait db
      - run: npm run db:migrate
      - run: npm run ops:secrets
      - name: Initialize audit-only reader
        run: docker compose -f docker-compose.ops.yml run --rm audit-reader-init
      - name: Start developer console
        run: docker compose -f docker-compose.ops.yml up -d grafana loki alloy docker-proxy notifier
      - name: Wait for Grafana
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3300/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Check authentication, database isolation, log ingestion and restart durability
        run: npm run ops:verify -- --restart-loki
      - name: Check production rules and isolated firing/recovery delivery
        run: npm run ops:verify-alerting
      - name: Check log agent without external network or channel secrets
        run: docker compose -f docker-compose.ops.yml run --rm agent-verification
      - name: Diagnostics
        if: failure()
        run: docker compose -f docker-compose.ops.yml logs --tail=100
      - name: Stop test stacks
        if: always()
        run: |
          docker compose -f docker-compose.ops.yml down
          docker compose -f docker-compose.yml down
