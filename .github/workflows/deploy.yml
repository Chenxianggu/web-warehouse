name: Deploy production

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag to deploy, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "image_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "image_repository=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.release.outputs.image_repository }}:${{ github.ref_name }}
            ${{ steps.release.outputs.image_repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  deploy:
    needs:
      - verify
      - publish
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || needs.publish.outputs.image_tag }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_PORT: ${{ secrets.PROD_PORT }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
      PROD_APP_DIR: ${{ vars.PROD_APP_DIR }}

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$PROD_HOST"
          test -n "$PROD_PORT"
          test -n "$PROD_USER"
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_KNOWN_HOSTS"
          test -n "$PROD_APP_DIR"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload production Compose file
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$PROD_PORT" docker-compose.prod.yml \
            "$PROD_USER@$PROD_HOST:$PROD_APP_DIR/docker-compose.prod.yml.next"

      - name: Deploy release
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            bash -s -- "$PROD_APP_DIR" "$DEPLOY_TAG" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          image_tag="$2"

          cd "$app_dir"
          mv docker-compose.prod.yml.next docker-compose.prod.yml
          export IMAGE_TAG="$image_tag"

          docker compose --env-file .env.prod -f docker-compose.prod.yml pull app
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans
          docker compose --env-file .env.prod -f docker-compose.prod.yml ps
          REMOTE
