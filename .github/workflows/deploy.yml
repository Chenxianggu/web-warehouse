name: Deploy production

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag to deploy, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

  deploy:
    needs: verify
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.verify.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      DEPLOY_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_PORT: ${{ secrets.PROD_PORT }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
      PROD_APP_DIR: ${{ vars.PROD_APP_DIR }}
      IMAGE_REPOSITORY: warehouse-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$PROD_HOST"
          test -n "$PROD_PORT"
          test -n "$PROD_USER"
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_KNOWN_HOSTS"
          test -n "$PROD_APP_DIR"

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/warehouse-src.tgz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            .

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host *
            BatchMode yes
            IdentitiesOnly yes
            IdentityFile ~/.ssh/id_ed25519
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ServerAliveInterval 10
            ServerAliveCountMax 3
            ConnectTimeout 20
            TCPKeepAlive yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Upload release files
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$PROD_PORT" /tmp/warehouse-src.tgz docker-compose.prod.yml \
            "$PROD_USER@$PROD_HOST:$PROD_APP_DIR/"

      - name: Build and deploy on server
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 28m \
            ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            bash -s -- "$PROD_APP_DIR" "$DEPLOY_TAG" "$IMAGE_REPOSITORY" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          image_tag="$2"
          image_repository="$3"

          cd "$app_dir"
          rm -rf src-build
          mkdir src-build
          tar -xzf warehouse-src.tgz -C src-build
          docker build -t "${image_repository}:${image_tag}" -t "${image_repository}:latest" src-build
          rm -rf src-build warehouse-src.tgz

          export IMAGE_REPOSITORY="$image_repository"
          export IMAGE_TAG="$image_tag"
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans
          docker compose --env-file .env.prod -f docker-compose.prod.yml ps
          REMOTE
