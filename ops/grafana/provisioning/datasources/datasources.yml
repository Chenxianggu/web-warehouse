apiVersion: 1
# Provisioning matches existing sources by name. Remove legacy definitions before
# recreating them with the same UIDs, preserving dashboard/rule references.
deleteDatasources:
  - name: Warehouse runtime
    orgId: 1
  - name: Warehouse audit (read only)
    orgId: 1
datasources:
  - name: 任仲塑料后台 · 运行日志
    uid: warehouse-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
  - name: 任仲塑料后台 · 操作审计（只读）
    uid: warehouse-audit
    type: grafana-postgresql-datasource
    access: proxy
    url: $AUDIT_DB_HOST:5432
    user: warehouse_log_reader
    editable: false
    jsonData:
      database: $AUDIT_DB_NAME
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 3
      maxIdleConns: 1
      connMaxLifetime: 600
    secureJsonData:
      password: $AUDIT_READER_PASSWORD
