# Reference/recovery template: certificates must already exist on this server.
# Install as the warehouse site, replacing its bootstrap configuration.
# Do not enable both templates at once. See docs/nginx.md.
server {
    listen 80;
    listen [::]:80;
    server_name yinfengsuliao.com www.yinfengsuliao.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yinfengsuliao.com www.yinfengsuliao.com;

    ssl_certificate /etc/letsencrypt/live/yinfengsuliao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yinfengsuliao.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:warehouse_tls:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
